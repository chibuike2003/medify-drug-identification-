<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend Request Dashboard</title>
    <style>
        /* General Styling */
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        /* Navbar Styling */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c3e50;
            padding: 15px;
            color: white;
        }

        .profile-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-container img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .profile-details {
            display: flex;
            flex-direction: column;
        }

        .profile-name {
            font-weight: bold;
        }

        .profile-email {
            font-size: 14px;
            color: #dcdcdc;
        }

        /* Back to Dashboard Button */
        .dashboard-btn {
            display: block;
            width: 150px;
            margin: 20px auto;
            padding: 10px;
            background-color: #3498db;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        /* Main Container */
        .container {
            width: 90%;
            margin: 20px auto;
            max-width: 800px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        /* Friend Request Box */
        .friend-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            cursor: pointer;
        }

        .friend-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .friend-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .friend-details {
            display: flex;
            flex-direction: column;
        }

        .friend-name {
            font-weight: bold;
            font-size: 16px;
        }

        .friend-email {
            font-size: 14px;
            color: #666;
        }

        .friend-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .add-btn {
            background-color: #1abc9c;
            color: white;
        }

        .decline-btn {
            background-color: #e74c3c;
            color: white;
        }

        /* Modal Styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 5px;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        .modal img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Responsive Design */
        @media screen and (max-width: 600px) {
            .friend-box {
                flex-direction: column;
                align-items: flex-start;
            }

            .friend-btn {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="profile-container">
            <img id="profile-img" src="user-avatar.png" alt="User Avatar">
            <div class="profile-details">
                <span id="profile-name" class="profile-name">John Doe</span>
                <span id="profile-email" class="profile-email">johndoe@gmail.com</span>
            </div>
        </div>
    </div>

    <!-- Back to Dashboard Button -->
    <a href="dashboard.html" class="dashboard-btn">Back to Dashboard</a>

    <!-- Friend Request Container -->
    <div class="container">
        <h2>Friend Requests</h2>

        <!-- Friend Requests -->
        <div class="friend-box" onclick="showModal('Alice Johnson', 'alice@gmail.com', 'friend1.jpg')">
            <div class="friend-info">
                <img src="friend1.jpg" alt="Friend 1">
                <div class="friend-details">
                    <span class="friend-name">Alice Johnson</span>
                    <span class="friend-email">alice@gmail.com</span>
                </div>
            </div>
            <button class="friend-btn add-btn" onclick="toggleFriendRequest(event, this)">Add Friend</button>
        </div>

        <div class="friend-box" onclick="showModal('Michael Smith', 'michael@gmail.com', 'friend2.jpg')">
            <div class="friend-info">
                <img src="friend2.jpg" alt="Friend 2">
                <div class="friend-details">
                    <span class="friend-name">Michael Smith</span>
                    <span class="friend-email">michael@gmail.com</span>
                </div>
            </div>
            <button class="friend-btn add-btn" onclick="toggleFriendRequest(event, this)">Add Friend</button>
        </div>

        <div class="friend-box" onclick="showModal('Sophia Williams', 'sophia@gmail.com', 'friend3.jpg')">
            <div class="friend-info">
                <img src="friend3.jpg" alt="Friend 3">
                <div class="friend-details">
                    <span class="friend-name">Sophia Williams</span>
                    <span class="friend-email">sophia@gmail.com</span>
                </div>
            </div>
            <button class="friend-btn add-btn" onclick="toggleFriendRequest(event, this)">Add Friend</button>
        </div>
    </div>

    <!-- Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <img id="modal-img" src="" alt="User">
            <h3 id="modal-name"></h3>
            <p id="modal-email"></p>
        </div>
    </div>

    <script>
        function toggleFriendRequest(event, button) {
            event.stopPropagation(); // Prevent triggering modal when clicking button
            if (button.classList.contains("add-btn")) {
                button.textContent = "Decline Request";
                button.classList.remove("add-btn");
                button.classList.add("decline-btn");
            } else {
                button.textContent = "Add Friend";
                button.classList.remove("decline-btn");
                button.classList.add("add-btn");
            }
        }

        function showModal(name, email, imgSrc) {
            document.getElementById("modal-name").textContent = name;
            document.getElementById("modal-email").textContent = email;
            document.getElementById("modal-img").src = imgSrc;
            document.getElementById("userModal").style.display = "block";
        }

        function closeModal() {
            document.getElementById("userModal").style.display = "none";
        }
    </script>

</body>
                  </html>
